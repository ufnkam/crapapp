[package]
name = "cargoapp"
version = "0.2.0"
edition = "2024"
description = "Library for building CRAP app installers and self-contained app bundles"
license = "Apache-2.0"
readme = "../../README.md"

[dependencies]
anyhow = "1.0.103"
cargo_metadata = "0.23.1"
clap = { version = "4.5.40", features = ["derive"] }
minijinja = "2.12.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
toml = "0.8.23"
usvg = { version = "0.47.0", default-features = false }
