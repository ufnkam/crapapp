[build]
publisher = "ufnkam"
display_name = "Example App"
packages = ["example"]
features = ["some_feature"]

[windows]
targets = [
    "x86_64-pc-windows-gnu",
]
install_path = "$INSTALLPATH"
files = [
    { source = "Cargo.toml", destination = "manifests/Cargo.toml" },
    { source = "some_assets", destination = "some_assets" },
]
associated_files = [
    { path = "$INSTALLPATH/saves", kind = "directory" },
    { path = "$INSTALLPATH/settings.json", kind = "file" },
]
eulas = [
    { path = "EULA.txt" },
    { path = "EULA2.txt", required = false },
]
display_icon = "build_assets/icon.ico"
installer = "gui"

