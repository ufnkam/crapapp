[build]
publisher = "ufnkam"
display_name = "Example App"
description = "Example app packaged by cargo-crapapp"
homepage = "https://example.com"
license = "MIT"
license_file = "LICENSE"
packages = ["example"]
features = ["some_feature"]

[windows]
targets = [
    "x86_64-pc-windows-gnu",
]
install_path = "$INSTALLPATH"
path_entries = ["$INSTALLPATH"]
files = [
    { source = "Cargo.toml", destination = "manifests/Cargo.toml" },
    { source = "some_assets", destination = "some_assets" },
]
associated_files = [
    { path = "$HOMEPATH/Documents/Example App/saves", kind = "directory" },
    { path = "$HOMEPATH/Documents/Example App/eulas", kind = "directory", eula_report = true },
    { path = "$INSTALLPATH/settings.json", kind = "file" },
]
shortcuts = [
    { binary = "first_bin", name = "Example First", directory = "Example App", icon = "build_assets/first.ico" },
    { binary = "second_bin", name = "Example Second", directory = "Example App", icon = "build_assets/second.ico" },
]
eulas = [
    { path = "EULA.txt" },
    { path = "EULA2.txt", required = false },
]
display_icon = "build_assets/icon.ico"
bundle = "msi"

[linux]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
bundle = ["deb", "rpm", "aur"]
bin_dir = "/usr/bin"
display_icon = "build_assets/icon.ico"
shortcuts = [
    { binary = "example", name = "Example App" },
    { binary = "first_bin", name = "Example First", icon = "build_assets/first.ico" },
    { binary = "second_bin", name = "Example Second", icon = "build_assets/second.ico" },
]
files = [
    { source = "Cargo.toml", destination = "/usr/share/doc/example/Cargo.toml" },
]
associated_files = [
    { path = "/var/lib/example", kind = "directory" },
]
eulas = [
    { path = "EULA.txt" },
    { path = "EULA2.txt", required = false },
]


[macos]
targets = [
    "aarch64-apple-darwin",
]
bundle = ["app", "pkg", "dmg"]
display_icon = "build_assets/icon.icns"
app_binary = "example"
eulas = [
    { path = "EULA.txt" },
    { path = "EULA2.txt", required = false },
]
files = [
    { source = "Cargo.toml", destination = "Resources/manifests/Cargo.toml" },
    { source = "some_assets", destination = "Resources/some_assets" },
]

[macos.pkg]
identifier = "com.ufnkam.example"
install_path = "/Applications"
bin_dir = "/usr/local/bin"
link_bins = true
